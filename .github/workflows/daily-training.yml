name: Daily training

# Retrains every model, re-evaluates against the baselines, and pushes
# the winners to the Hopsworks model registry.
#
# Reads features from Hopsworks rather than from a local CSV, so the
# runner needs no data checked in. Training artifacts are uploaded to
# the run so a regression can be inspected without re-running locally.

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 07:30 Karachi, after the night's data
  workflow_dispatch:

concurrency:
  group: training
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull features from the feature store
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m src.training_pipeline.export_features

      - name: Train and evaluate
        run: python -m src.training_pipeline.train_hourly

      - name: Register models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m src.feature_store.hopsworks_sync --models

      - name: Upload training summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-summary-${{ github.run_number }}
          path: |
            models/hourly_training_summary.csv
          retention-days: 30